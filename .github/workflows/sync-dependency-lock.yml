name: Sync dependency lockfile
on:
  push:
    branches:
      - security/update-next-dependencies
    paths:
      - package.json
  pull_request:
    branches:
      - main
    paths:
      - package.json
permissions:
  contents: write
jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Update lockfile with compatible security fixes
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update dependency lockfile for security fixes"
          git push
